<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', sans-serif;
    }

    body {
        height: 100vh;
        background: linear-gradient(135deg, #667eea, #764ba2);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .card {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(15px);
        padding: 30px;
        border-radius: 20px;
        text-align: center;
        color: white;
        width: 320px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        transition: 0.4s;
    }

    .card:hover {
        transform: translateY(-10px) scale(1.02);
    }

    .profile-img {
        width: 130px;
        height: 130px;
        border-radius: 50%;
        border: 4px solid white;
        margin-bottom: 15px;
    }

    h1 {
        font-size: 24px;
        margin-bottom: 5px;
    }

    .tag {
        font-size: 14px;
        color: #ddd;
        margin-bottom: 15px;
    }

    .info {
        margin: 10px 0;
        font-size: 14px;
    }

    .btn {
        display: inline-block;
        margin-top: 15px;
        padding: 10px 20px;
        border-radius: 25px;
        background: white;
        color: #764ba2;
        text-decoration: none;
        font-weight: bold;
        transition: 0.3s;
    }

    .btn:hover {
        background: #ffd369;
        color: black;
    }
</style>

</head>
<body>

<div class="card">

    <!-- PHOTO (already added) -->
    <img src="krishna.jpg" class="profile-img">

    <!-- NAME -->
    <h1>Your Name</h1>
    <div class="tag">12th Pass</div>

    <!-- DETAILS -->
    <div class="info">📞 +91 99908 24883</div>
    <div class="info">📧 krishansain719@gmail.com</div>

    <!-- BUTTON -->
    <a href="mailto:krishansain719@gmail.com" class="btn">Contact Me</a>

</div>

</body>
</html>
